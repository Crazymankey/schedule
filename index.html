<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>孟擇私人秘書 | 工作與客戶管理系統</title>
  <style>
    :root {
      --bg-main: #F5EFE6;        /* 燕麥奶茶底色 */
      --bg-card: #FAF7F2;        /* 奶泡白卡片 */
      --bg-hover: #EFE5D8;       /* 淺拿鐵懸停 */
      --primary: #A67B5B;        /* 焦糖奶茶主色 */
      --primary-dark: #825B3E;   /* 深焙焦糖 */
      --accent: #D4A373;         /* 暖金棕標記 */
      --text-main: #4A3B32;      /* 深咖啡主文字 */
      --text-muted: #8C7A6B;     /* 淺咖次要文字 */
      --border: #E2D5C5;         /* 柔邊線條 */
      --today-bg: #E6CCB2;       /* 今日標記 */
      --done-color: #B5A89B;     /* 完成後的刪除線顏色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
    }

    /* 頂部控制列 */
    header {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.04);
    }

    .title-group h1 {
      font-size: 1.6rem;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .title-group p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    .year-display {
      font-size: 1.3rem;
      font-weight: 700;
      min-width: 80px;
      text-align: center;
      color: var(--primary-dark);
    }

    /* 頁面切換容器 */
    .view-container {
      max-width: 1400px;
      margin: 0 auto;
      display: none;
    }

    .view-container.active {
      display: block;
    }

    /* 12個月格狀排版 */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }

    .month-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 10px rgba(74, 59, 50, 0.03);
      transition: transform 0.2s ease;
    }

    .month-card:hover {
      transform: translateY(-2px);
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .month-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .month-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 4px;
    }

    .weekdays div {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease;
    }

    .day:hover:not(.empty) {
      background: var(--bg-hover);
    }

    .day.empty {
      cursor: default;
    }

    .day.today {
      background: var(--today-bg);
      font-weight: 700;
      color: var(--text-main);
    }

    .day.has-event {
      font-weight: 700;
      color: var(--primary-dark);
      border: 1px solid var(--accent);
    }

    .day.has-event::after {
      content: "";
      width: 5px;
      height: 5px;
      background-color: var(--primary);
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    /* 客戶名單排版 */
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .client-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(74, 59, 50, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .client-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .client-phone {
      font-size: 0.9rem;
      color: var(--text-muted);
      background: var(--bg-main);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .client-body {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .client-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 行程檢視彈窗 (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 50, 0.45);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(74, 59, 50, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: var(--primary-dark);
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      padding: 0 6px;
    }

    .close-btn:hover {
      background: transparent;
      color: var(--text-main);
    }

    .event-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .event-item {
      background: var(--bg-main);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-info.done .event-title {
      text-decoration: line-through;
      color: var(--done-color);
    }

    .event-time {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .event-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .event-note {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .done-btn {
      font-size: 0.8rem;
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .no-event {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>孟擇私人秘書系統</h1>
      <p>結合年度行事曆與客戶名單的全自動化管理中樞</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('calendar')">📅 年度行事曆</button>
      <button class="tab-btn" onclick="switchView('clients')">👥 客戶名單</button>
    </div>
    <div class="controls" id="calendarControls">
      <button onclick="changeYear(-1)">◀ 上一年</button>
      <div class="year-display" id="yearDisplay">2026</div>
      <button onclick="changeYear(1)">下一年 ▶</button>
      <button onclick="resetToToday()">回到今年</button>
    </div>
  </header>

  <!-- 行事曆視圖 -->
  <main class="view-container active" id="calendarView">
    <div class="year-grid" id="yearGrid"></div>
  </main>

  <!-- 客戶名單視圖 -->
  <main class="view-container" id="clientsView">
    <div class="client-grid" id="clientGrid">
      <div class="no-event">載入中... ☕</div>
    </div>
  </main>

  <!-- 點擊日期彈出的行程細節視窗 -->
  <div class="modal-overlay" id="eventModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalDateTitle"></h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <ul class="event-list" id="modalEventList"></ul>
    </div>
  </div>

  <script>
    let calendarEvents = {};
    let clientList = [];

    const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
    const today = new Date();
    let currentYear = today.getFullYear();
    let activeDateStr = "";

    async function loadData() {
      try {
        const resEv = await fetch('./events.json?t=' + Date.now());
        if (resEv.ok) calendarEvents = await resEv.json();
      } catch (e) {}

      try {
        const resCl = await fetch('./clients.json?t=' + Date.now());
        if (resCl.ok) clientList = await resCl.json();
      } catch (e) {}

      renderCalendar(currentYear);
      renderClients();
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      if (viewName === 'calendar') {
        document.getElementById('calendarView').classList.add('active');
        event.target.classList.add('active');
        document.getElementById('calendarControls').style.display = 'flex';
      } else {
        document.getElementById('clientsView').classList.add('active');
        event.target.classList.add('active');
        document.getElementById('calendarControls').style.display = 'none';
        renderClients();
      }
    }

    function renderClients() {
      const grid = document.getElementById('clientGrid');
      grid.innerHTML = "";
      if (!clientList || clientList.length === 0) {
        grid.innerHTML = `<div class="no-event" style="grid-column: 1/-1;">目前還沒有新增任何客戶檔案 ☕</div>`;
        return;
      }
      clientList.forEach((client, index) => {
        const card = document.createElement('div');
        card.className = 'client-card';
        card.innerHTML = `
          <div>
            <div class="client-header">
              <span class="client-name">👤 ${client.name}</span>
              <span class="client-phone">📞 ${client.phone}</span>
            </div>
            <div class="client-body" style="margin-top: 10px;">
              ${client.note ? `📝 備註：${client.note}` : '無特別備註'}
            </div>
          </div>
          <div class="client-date">建立日期：${client.createdAt || '未知'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCalendar(year) {
      document.getElementById("yearDisplay").textContent = `${year} 年`;
      const grid = document.getElementById("yearGrid");
      grid.innerHTML = "";

      for (let month = 0; month < 12; month++) {
        const card = document.createElement("div");
        card.className = "month-card";

        const header = document.createElement("div");
        header.className = "month-header";
        header.innerHTML = `
          <span class="month-name">${month + 1} 月</span>
          <span class="month-sub">${year} / ${String(month + 1).padStart(2, "0")}</span>
        `;
        card.appendChild(header);

        const weekdaysRow = document.createElement("div");
        weekdaysRow.className = "weekdays";
        weekDays.forEach(day => {
          const d = document.createElement("div");
          d.textContent = day;
          weekdaysRow.appendChild(d);
        });
        card.appendChild(weekdaysRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement("div");
          empty.className = "day empty";
          daysGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dayCell = document.createElement("div");
          dayCell.className = "day";
          dayCell.textContent = day;

          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

          if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            dayCell.classList.add("today");
          }

          if (calendarEvents[dateStr] && calendarEvents[dateStr].length > 0) {
            dayCell.classList.add("has-event");
          }

          dayCell.onclick = () => openModal(year, month + 1, day, dateStr);
          daysGrid.appendChild(dayCell);
        }

        card.appendChild(daysGrid);
        grid.appendChild(card);
      }
    }

    function openModal(year, month, day, dateStr) {
      activeDateStr = dateStr;
      document.getElementById("modalDateTitle").textContent = `${year} 年 ${month} 月 ${day} 日`;
      renderModalEvents();
      document.getElementById("eventModal").classList.add("active");
    }

    function renderModalEvents() {
      const list = document.getElementById("modalEventList");
      list.innerHTML = "";

      const events = calendarEvents[activeDateStr];
      if (events && events.length > 0) {
        events.forEach((ev, idx) => {
          const li = document.createElement("li");
          li.className = "event-item";
          li.innerHTML = `
            <div class="event-info ${ev.done ? 'done' : ''}">
              <div class="event-time">${ev.time || "全天"}</div>
              <div class="event-title">${ev.title}</div>
              ${ev.note ? `<div class="event-note">${ev.note}</div>` : ""}
            </div>
            <button class="done-btn" onclick="toggleDone('${activeDateStr}', ${idx})">${ev.done ? '取消畫線' : '達成畫線'}</button>
          `;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = `<div class="no-event">這一天目前沒有安排行程 ☕</div>`;
      }
    }

    function toggleDone(dateStr, index) {
      if (calendarEvents[dateStr] && calendarEvents[dateStr][index]) {
        calendarEvents[dateStr][index].done = !calendarEvents[dateStr][index].done;
        renderModalEvents();
        renderCalendar(currentYear);
      }
    }

    function closeModal() {
      document.getElementById("eventModal").classList.remove("active");
    }

    function changeYear(delta) {
      currentYear += delta;
      renderCalendar(currentYear);
    }

    function resetToToday() {
      currentYear = today.getFullYear();
      renderCalendar(currentYear);
    }

    loadData();
  </script>
</body>
</html>
