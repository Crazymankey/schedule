<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私人秘書 | 工作與客戶管理系統</title>
  <style>
    :root {
      --bg-main: #F5EFE6;
      --bg-card: #FAF7F2;
      --bg-hover: #EFE5D8;
      --primary: #A67B5B;
      --primary-dark: #825B3E;
      --accent: #D4A373;
      --text-main: #4A3B32;
      --text-muted: #8C7A6B;
      --border: #E2D5C5;
      --today-bg: #E6CCB2;
      --done-color: #B5A89B;
      --danger: #C85A53;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.04);
    }

    .title-group h1 { font-size: 1.6rem; color: var(--text-main); letter-spacing: 1px; }
    .title-group p { font-size: 0.9rem; color: var(--text-muted); }

    .nav-tabs { display: flex; flex-wrap: wrap; gap: 10px; }

    .tab-btn, button {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover, button:hover:not(:disabled) {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .year-display { font-size: 1.3rem; font-weight: 700; min-width: 84px; text-align: center; color: var(--primary-dark); }

    .view-container { max-width: 1400px; margin: 0 auto; display: none; }
    .view-container.active { display: block; }

    .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
    .month-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 10px rgba(74, 59, 50, 0.03);
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .month-name { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); }
    .month-sub { font-size: 0.8rem; color: var(--text-muted); }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 4px; }
    .weekdays div { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); padding-bottom: 6px; }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      position: relative;
    }

    .day:hover:not(.empty) { background: var(--bg-hover); }
    .day.empty { cursor: default; }
    .day.today { background: var(--today-bg); font-weight: 700; }
    .day.has-event { font-weight: 700; color: var(--primary-dark); border: 1px solid var(--accent); }
    .day.has-event::after {
      content: "";
      width: 5px;
      height: 5px;
      background-color: var(--primary);
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .client-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(74, 59, 50, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .client-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .client-card.done .client-name, .client-card.done .client-body {
      text-decoration: line-through;
      color: var(--done-color);
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .client-name { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); }
    .client-phone { font-size: 0.88rem; color: var(--text-muted); background: var(--bg-main); padding: 2px 8px; border-radius: 6px; }
    .client-address { font-size: 0.92rem; font-weight: 600; color: var(--primary-dark); margin-top: 8px; }
    .client-body { font-size: 0.92rem; color: var(--text-main); margin-top: 6px; }
    .client-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 50, 0.45);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(74, 59, 50, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 { font-size: 1.25rem; color: var(--primary-dark); }
    .close-btn { background: transparent; border: none; font-size: 1.4rem; color: var(--text-muted); padding: 0 6px; }
    .close-btn:hover { background: transparent; color: var(--text-main); }

    .event-list { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }
    .event-item {
      background: var(--bg-main);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .event-info.done .event-title { text-decoration: line-through; color: var(--done-color); }
    .event-time { font-size: 0.82rem; font-weight: 700; color: var(--primary-dark); }
    .event-title { font-size: 0.98rem; font-weight: 600; margin-top: 2px; }
    .event-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { font-size: 0.78rem; padding: 5px 10px; border-radius: 6px; }
    .btn-del { color: var(--danger); border-color: #E8C5C3; }
    .btn-del:hover:not(:disabled) { background: var(--danger); color: #FFF; border-color: var(--danger); }

    .no-event { text-align: center; color: var(--text-muted); padding: 24px 0; font-size: 0.95rem; }

    .sync-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary-dark);
      color: #FFF;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 2000;
    }
    .sync-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>私人秘書系統</h1>
      <p>結合年度行事曆與客戶名單的全自動化管理中樞</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabCalendar" onclick="switchView('calendar')">📅 年度行事曆</button>
      <button class="tab-btn" id="tabClients" onclick="switchView('clients')">👥 客戶名單</button>
      <button onclick="refreshFromCloud(true)" id="refreshBtn">🔄 重新讀取</button>
    </div>
    <div class="controls" id="calendarControls">
      <button onclick="changeYear(-1)">◀ 上一年</button>
      <div class="year-display" id="yearDisplay">2026 年</div>
      <button onclick="changeYear(1)">下一年 ▶</button>
      <button onclick="resetToToday()">回到今年</button>
    </div>
  </header>

  <main class="view-container active" id="calendarView">
    <div class="year-grid" id="yearGrid"></div>
  </main>

  <main class="view-container" id="clientsView">
    <div class="client-grid" id="clientGrid">
      <div class="no-event">載入中... ☕</div>
    </div>
  </main>

  <div class="modal-overlay" id="eventModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalDateTitle"></h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <ul class="event-list" id="modalEventList"></ul>
    </div>
  </div>

  <div class="modal-overlay" id="clientModal" onclick="closeClientModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="clientModalTitle">客戶管理</h2>
        <button class="close-btn" onclick="closeClientModal()">✕</button>
      </div>
      <p id="clientModalDetail" style="margin-bottom: 18px; color: var(--text-muted); font-size: 0.92rem;"></p>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="clientToggleDoneBtn" onclick="toggleClientDone()">✅ 達成畫線</button>
        <button class="btn-del" onclick="deleteClient()">🗑️ 客戶取消 / 刪除</button>
      </div>
    </div>
  </div>

  <div class="sync-toast" id="syncToast">正在同步至 Google 試算表...</div>

  <script>
    const SYNC_WEBHOOK_URL = "https://primary-production-5317642b.up.railway.app/webhook/schedule-sync";

    let calendarEvents = {};
    let clientList = [];
    let isSyncing = false;

    const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
    const today = new Date();
    let currentYear = today.getFullYear();
    let activeDateStr = "";
    let selectedClientIndex = -1;

    function showToast(msg) {
      const toast = document.getElementById("syncToast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll("button").forEach(btn => {
        if (!btn.classList.contains("close-btn")) {
          btn.disabled = disabled;
        }
      });
    }

    async function syncToSheet(payload) {
      if (isSyncing) {
        showToast("⏳ 正在同步中，請稍候...");
        return;
      }
      isSyncing = true;
      setButtonsDisabled(true);
      showToast("⏳ 正在同步更新至 Google 試算表...");

      try {
        const res = await fetch(SYNC_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          await refreshFromCloud(false);
          showToast("✅ 已同步更新最新資料！");
        } else {
          showToast("⚠️ 同步回應異常，請檢查 Railway n8n");
        }
      } catch (err) {
        showToast("⚠️ 無法連線至 Railway 同步伺服器");
      } finally {
        isSyncing = false;
        setButtonsDisabled(false);
      }
    }

    async function refreshFromCloud(notify = false) {
      try {
        const res = await fetch(SYNC_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "getAll" })
        });
        if (res.ok) {
          const data = await res.json();
          calendarEvents = (data && data.events && typeof data.events === "object" && !Array.isArray(data.events)) ? data.events : {};
          clientList = (data && Array.isArray(data.clients)) ? data.clients : [];
        }
      } catch (e) {
        if (notify) showToast("⚠️ 讀取雲端資料失敗");
      }

      renderCalendar(currentYear);
      renderClients();
      if (activeDateStr && document.getElementById("eventModal").classList.contains("active")) {
        renderModalEvents();
      }
      if (notify) {
        showToast("🔄 已重新讀取最新資料");
      }
    }

    function switchView(viewName) {
      document.querySelectorAll(".view-container").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));

      if (viewName === "calendar") {
        document.getElementById("calendarView").classList.add("active");
        document.getElementById("tabCalendar").classList.add("active");
        document.getElementById("calendarControls").style.display = "flex";
      } else {
        document.getElementById("clientsView").classList.add("active");
        document.getElementById("tabClients").classList.add("active");
        document.getElementById("calendarControls").style.display = "none";
        renderClients();
      }
    }

    function renderClients() {
      const grid = document.getElementById("clientGrid");
      grid.innerHTML = "";
      if (!Array.isArray(clientList) || clientList.length === 0) {
        grid.innerHTML = `<div class="no-event" style="grid-column: 1/-1;">目前還沒有新增任何客戶檔案 ☕</div>`;
        return;
      }

      clientList.forEach((client, index) => {
        const card = document.createElement("div");
        card.className = `client-card ${client.done ? "done" : ""}`;
        card.onclick = () => openClientModal(index);
        card.innerHTML = `
          <div>
            <div class="client-header">
              <span class="client-name">👤 ${client.name || "未命名"}</span>
              <span class="client-phone">📞 ${client.phone || "未提供"}</span>
            </div>
            <div class="client-address">📍 居住地：${client.address || "未填寫"}</div>
            <div class="client-body">
              ${client.note ? `📝 備註：${client.note}` : "無特別備註"}
            </div>
          </div>
          <div class="client-footer">
            <span>建立：${client.createdAt || "未知"}</span>
            <span>點擊卡片管理 ➔</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openClientModal(index) {
      selectedClientIndex = index;
      const client = clientList[index];
      if (!client) return;
      document.getElementById("clientModalTitle").textContent = `👤 ${client.name || "未命名"}`;
      document.getElementById("clientModalDetail").innerHTML = `
        📞 電話：${client.phone || "未提供"}<br>
        📍 居住地：${client.address || "未填寫"}<br>
        📝 備註：${client.note || "無"}
      `;
      document.getElementById("clientToggleDoneBtn").textContent = client.done ? "↩️ 取消畫線" : "✅ 達成畫線";
      document.getElementById("clientModal").classList.add("active");
    }

    function closeClientModal() {
      document.getElementById("clientModal").classList.remove("active");
      selectedClientIndex = -1;
    }

    function toggleClientDone() {
      if (selectedClientIndex > -1 && clientList[selectedClientIndex]) {
        const targetClient = clientList[selectedClientIndex];
        targetClient.done = !targetClient.done;
        renderClients();
        closeClientModal();
        syncToSheet({
          target: "clients",
          action: "toggleDone",
          id: targetClient.id,
          done: targetClient.done
        });
      }
    }

    function deleteClient() {
      if (selectedClientIndex > -1 && clientList[selectedClientIndex]) {
        const delIdx = selectedClientIndex;
        const targetClient = clientList[delIdx];
        const targetName = targetClient.name || "此客戶";
        if (confirm(`確定要刪除客戶「${targetName}」嗎？`)) {
          clientList.splice(delIdx, 1);
          renderClients();
          closeClientModal();
          syncToSheet({
            target: "clients",
            action: "delete",
            id: targetClient.id,
            rowNumber: targetClient.rowNumber || (delIdx + 2)
          });
        }
      }
    }

    function renderCalendar(year) {
      document.getElementById("yearDisplay").textContent = `${year} 年`;
      const grid = document.getElementById("yearGrid");
      grid.innerHTML = "";

      for (let month = 0; month < 12; month++) {
        const card = document.createElement("div");
        card.className = "month-card";

        const header = document.createElement("div");
        header.className = "month-header";
        header.innerHTML = `
          <span class="month-name">${month + 1} 月</span>
          <span class="month-sub">${year} / ${String(month + 1).padStart(2, "0")}</span>
        `;
        card.appendChild(header);

        const weekdaysRow = document.createElement("div");
        weekdaysRow.className = "weekdays";
        weekDays.forEach(day => {
          const d = document.createElement("div");
          d.textContent = day;
          weekdaysRow.appendChild(d);
        });
        card.appendChild(weekdaysRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement("div");
          empty.className = "day empty";
          daysGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dayCell = document.createElement("div");
          dayCell.className = "day";
          dayCell.textContent = day;

          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

          if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            dayCell.classList.add("today");
          }

          if (Array.isArray(calendarEvents[dateStr]) && calendarEvents[dateStr].length > 0) {
            dayCell.classList.add("has-event");
          }

          dayCell.onclick = () => openModal(year, month + 1, day, dateStr);
          daysGrid.appendChild(dayCell);
        }

        card.appendChild(daysGrid);
        grid.appendChild(card);
      }
    }

    function openModal(year, month, day, dateStr) {
      activeDateStr = dateStr;
      document.getElementById("modalDateTitle").textContent = `${year} 年 ${month} 月 ${day} 日`;
      renderModalEvents();
      document.getElementById("eventModal").classList.add("active");
    }

    function renderModalEvents() {
      const list = document.getElementById("modalEventList");
      list.innerHTML = "";

      const events = calendarEvents[activeDateStr];
      if (Array.isArray(events) && events.length > 0) {
        events.forEach((ev, idx) => {
          const li = document.createElement("li");
          li.className = "event-item";
          li.innerHTML = `
            <div class="event-info ${ev.done ? "done" : ""}">
              <div class="event-time">${ev.time || "全天"}</div>
              <div class="event-title">${ev.title}</div>
              ${ev.note ? `<div class="event-note">${ev.note}</div>` : ""}
            </div>
            <div class="action-btns">
              <button class="btn-sm" onclick="toggleDone('${activeDateStr}', ${idx})">${ev.done ? "取消畫線" : "達成畫線"}</button>
              <button class="btn-sm btn-del" onclick="deleteEvent('${activeDateStr}', ${idx})">刪除</button>
            </div>
          `;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = `<div class="no-event">這一天目前沒有安排行程 ☕</div>`;
      }
    }

    function toggleDone(dateStr, index) {
      if (calendarEvents[dateStr] && calendarEvents[dateStr][index]) {
        const targetEv = calendarEvents[dateStr][index];
        targetEv.done = !targetEv.done;
        renderModalEvents();
        renderCalendar(currentYear);
        syncToSheet({
          target: "events",
          action: "toggleDone",
          id: targetEv.id,
          done: targetEv.done
        });
      }
    }

    function deleteEvent(dateStr, index) {
      if (calendarEvents[dateStr] && calendarEvents[dateStr][index]) {
        const targetEv = calendarEvents[dateStr][index];
        const evTitle = targetEv.title || "此行程";
        if (confirm(`確定要刪除行程「${evTitle}」嗎？`)) {
          calendarEvents[dateStr].splice(index, 1);
          if (calendarEvents[dateStr].length === 0) {
            delete calendarEvents[dateStr];
          }
          renderModalEvents();
          renderCalendar(currentYear);
          syncToSheet({
            target: "events",
            action: "delete",
            id: targetEv.id,
            rowNumber: targetEv.rowNumber || (index + 2)
          });
        }
      }
    }

    function closeModal() {
      document.getElementById("eventModal").classList.remove("active");
    }

    function changeYear(delta) {
      currentYear += delta;
      renderCalendar(currentYear);
    }

    function resetToToday() {
      currentYear = today.getFullYear();
      renderCalendar(currentYear);
    }

    refreshFromCloud(false);
  </script>
</body>
</html>
